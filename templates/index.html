<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARBJIT AI - Cute Chat</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #0b071e;
            background-image: radial-gradient(circle at 50% 50%, #1a103c 0%, #0b071e 100%);
            color: #ffc2eb; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; height: 100vh; margin: 0;
            border: 2px solid #ff2a8d; border-radius: 10px; overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 42, 141, 0.3);
        }
        header {
            background: rgba(20, 10, 40, 0.9); padding: 12px 20px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 2px solid rgba(255, 42, 141, 0.3);
        }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { font-size: 1.3rem; background: rgba(255, 42, 141, 0.2); padding: 5px 10px; border-radius: 8px; }
        .logo-text { font-size: 1.1rem; font-weight: bold; color: #ff75ce; }
        .status-badge { font-size: 0.75rem; background: #ff2a8d; color: #fff; padding: 4px 10px; border-radius: 20px; }
        
        #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message {
            padding: 12px 16px; border-radius: 16px; max-width: 82%; word-wrap: break-word;
            line-height: 1.5; white-space: pre-wrap; font-size: 0.95rem;
        }
        .user {
            background: linear-gradient(135deg, #d946ef, #8b5cf6);
            color: white; align-self: flex-end;
            border-bottom-right-radius: 4px;
            border: 1px solid #f472b6;
        }
        .bot {
            background: rgba(26, 15, 50, 0.9);
            color: #fbcfe8; align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 2px solid #a855f7;
        }
        .typing { font-style: italic; color: #f472b6; background: rgba(26, 15, 50, 0.5); }
        
        .input-container {
            background: rgba(15, 7, 30, 0.95);
            border-top: 2px solid rgba(255, 42, 141, 0.3);
            padding: 10px 15px;
        }
        .input-area {
            display: flex;
            gap: 8px;
            align-items: center;
            width: 100%;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #7e22ce;
            border-radius: 20px;
            background: rgba(30, 15, 60, 0.8);
            color: white;
            outline: none;
            font-size: 0.95rem;
            min-width: 0;
        }
        input[type="text"]:focus { border-color: #ff2a8d; }
        button.send-btn {
            background: linear-gradient(135deg, #ff2a8d, #d946ef);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 12px 18px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="logo-icon">🤖</div>
            <div class="logo-text">SARBJIT AI</div>
        </div>
        <div class="status-badge">Active</div>
    </header>

    <div id="chat-box">
        <div class="message bot">Hello Sarbjit ji! ✨ Dasso aj ki nawa project banana aa?</div>
    </div>

    <div class="input-container">
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type a message...">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const messageText = inputField.value.trim();

            if (!messageText) return;

            chatBox.innerHTML += `<div class="message user">${messageText}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            const typingId = "typing-" + Date.now();
            chatBox.innerHTML += `<div id="${typingId}" class="message bot typing">Sarbjit ji, soch ਰਿਹਾ ਹਾਂ...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            inputField.value = "";

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message: messageText })
                });
                
                const data = await response.json();
                document.getElementById(typingId).remove();
                
                const botReply = data.response || "Jawab mil gaya!";
                chatBox.innerHTML += `<div class="message bot">${botReply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                document.getElementById(typingId).remove();
                chatBox.innerHTML += `<div class="message bot">⚠️ Connection error aa gaya veer!</div>`;
            }
        }

        document.getElementById("user-input").addEventListener("keypress", function(e) {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
