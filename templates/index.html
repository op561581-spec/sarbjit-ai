<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARBJIT AI - Cute Chat</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #0b071e;
            background-image: radial-gradient(circle at 50% 50%, #1a103c 0%, #0b071e 100%);
            color: #ffc2eb; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; flex-direction: column; height: 100vh; margin: 0; 
            border: 2px solid #ff2a8d; border-radius: 10px; overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 42, 141, 0.3);
        }
        /* Header */
        header { 
            background: rgba(20, 10, 40, 0.9); padding: 12px 20px; 
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 2px solid rgba(255, 42, 141, 0.3); 
        }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { font-size: 1.3rem; background: rgba(255, 42, 141, 0.2); padding: 5px 8px; border-radius: 50%; border: 1px solid #ff2a8d; }
        .logo-text { font-size: 1.1rem; font-weight: bold; color: #ff75ce; }
        .status-badge { font-size: 0.75rem; background: #ff2a8d; color: #fff; padding: 3px 10px; border-radius: 12px; }

        /* Chat Box */
        #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        
        .message { 
            padding: 12px 16px; border-radius: 16px; max-width: 82%; word-wrap: break-word; 
            line-height: 1.5; white-space: pre-wrap; font-size: 0.95rem; 
        }

        .user { 
            background: linear-gradient(135deg, #d946ef, #8b5cf6); 
            color: white; align-self: flex-end; 
            border-bottom-right-radius: 4px;
            border: 1px solid #f472b6;
        }
        
        .bot { 
            background: rgba(26, 15, 50, 0.9); 
            color: #fbcfe8; align-self: flex-start; 
            border-bottom-left-radius: 4px;
            border: 2px solid #a855f7;
        }

        pre { background: #0f071e; padding: 10px; border-radius: 8px; overflow-x: auto; border: 1px solid #7e22ce; margin-top: 8px; }
        code { font-family: 'Courier New', Courier, monospace; color: #f472b6; }

        .typing { font-style: italic; color: #f472b6; background: rgba(26, 15, 50, 0.6); border: 1px dashed #a855f7; }

        /* Input Area - Fixed Alignment */
        .input-container { 
            background: rgba(15, 7, 30, 0.95); 
            border-top: 2px solid rgba(255, 42, 141, 0.3); 
            padding: 10px 15px; 
        }
        .file-indicator { font-size: 0.8rem; color: #f472b6; margin-bottom: 4px; display: block; }
        
        .input-area { 
            display: flex; 
            gap: 8px; 
            align-items: center; 
            width: 100%;
        }
        
        input[type="text"] { 
            flex: 1; 
            padding: 12px 15px; 
            border: 2px solid #7e22ce; 
            border-radius: 20px; 
            background: rgba(30, 15, 60, 0.8); 
            color: white; 
            outline: none; 
            font-size: 0.95rem; 
            min-width: 0;
        }
        input[type="text"]:focus { border-color: #ff2a8d; }
        
        .action-btn { 
            background: rgba(88, 28, 135, 0.6); 
            color: #fbcfe8; 
            border: 1px solid #a855f7; 
            padding: 10px; 
            border-radius: 50%; 
            cursor: pointer; 
            font-size: 1rem; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            flex-shrink: 0;
        }
        
        button.send-btn { 
            background: linear-gradient(135deg, #ff2a8d, #d946ef); 
            color: white; 
            border: none; 
            border-radius: 20px; 
            padding: 12px 18px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 0.95rem; 
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="logo-icon">💻</div>
            <div>
                <div class="logo-text">SARBJIT AI</div>
            </div>
        </div>
        <div class="status-badge">Active</div>
    </header>

    <div id="chat-box">
        <div class="message bot">Hello Sarbjit ji! ✨ Dasso aj ki nawa project ya code banana aa?</div>
    </div>
    
    <div class="input-container">
        <span id="file-name" class="file-indicator"></span>
        <div class="input-area">
            <label class="action-btn" title="Upload Image">📁
                <input type="file" id="media-file" style="display: none;" accept="image/*">
            </label>
            <button class="action-btn" onclick="startVoice()" title="Voice Input">🎤</button>
            <input type="text" id="user-input" placeholder="Type a message..." autofocus>
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('media-file');
        const fileNameSpan = document.getElementById('file-name');

        fileInput.addEventListener('change', () => {
            if(fileInput.files.length > 0) {
                fileNameSpan.innerText = "📎 Attached: " + fileInput.files[0].name;
            }
        });

        function startVoice() {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'pa-IN';
            recognition.start();
            recognition.onresult = function(event) {
                document.getElementById('user-input').value = event.results[0][0].transcript;
            };
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const messageText = inputField.value.trim();
            const file = fileInput.files[0];

            if (!messageText && !file) return;

            let displayMsg = messageText;
            if (file) displayMsg = `[Image: ${file.name}] ${messageText}`;

            chatBox.innerHTML += `<div class="message user">${displayMsg}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            const typingId = "typing-" + Date.now();
            chatBox.innerHTML += `<div id="${typingId}" class="message bot typing">SARBJIT AI is typing...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            const formData = new FormData();
            formData.append('message', messageText);
            if (file) formData.append('file', file);

            inputField.value = '';
            fileInput.value = '';
            fileNameSpan.innerText = '';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                document.getElementById(typingId).remove();
                chatBox.innerHTML += `<div class="message bot">${data.reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                document.getElementById(typingId).remove();
                chatBox.innerHTML += `<div class="message bot">⚠️ Connection error. Try again!</div>`;
            }
        }

        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
